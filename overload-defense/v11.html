function heroStopsEnemy(e,step){

}

function towerUpgradePreview(t){
 if(t.level>=MAX_TOWER_LEVEL)return null;
 const future={...t,level:t.level+1},prev=stats(t),next=stats(future);
 if(t.type===4){
  const a=guardStats(t),b=guardStats(future);
  return 'HP бойца '+Math.round(a.hp)+'→'+Math.round(b.hp)+' (+'+Math.round(b.hp-a.hp)+')   Урон '+Math.round(a.dmg)+'→'+Math.round(b.dmg)+' (+'+Math.round(b.dmg-a.dmg)+')';
 }
 return 'Урон '+Math.round(prev.dmg)+'→'+Math.round(next.dmg)+' ('+statDiff(Math.round(next.dmg),Math.round(prev.dmg))+')   Скор. '+prev.rate.toFixed(1)+'→'+next.rate.toFixed(1)+' ('+statDiff(Number(next.rate.toFixed(1)),Number(prev.rate.toFixed(1)))+') · Дал. '+Math.round(prev.range)+'→'+Math.round(next.range)+' ('+statDiff(Math.round(next.range),Math.round(prev.range))+')';
}
function specPreview(t,branch){

 if(t.type===4){const old=guardStats(t),newStat=guardStats({...t,spec:branch});return branch===0?'HP '+Math.round(old.hp)+'→'+Math.round(newStat.hp)+' (+'+Math.round(newStat.hp-old.hp)+')':'Урон '+Math.round(old.dmg)+'→'+Math.round(newStat.dmg)+' (+'+Math.round(newStat.dmg-old.dmg)+')';}
 const changes=[];
 if(next.dmg!==prev.dmg)changes.push('Урон '+Math.round(prev.dmg)+'→'+Math.round(next.dmg)+' ('+statDiff(Math.round(next.dmg),Math.round(prev.dmg))+')');
 if(next.rate!==prev.rate)changes.push('Скор. '+prev.rate.toFixed(1)+'→'+next.rate.toFixed(1)+' ('+statDiff(Number(next.rate.toFixed(1)),Number(prev.rate.toFixed(1)))+')');
 if(next.range!==prev.range)changes.push('Дал. '+prev.range+'→'+next.range+' ('+statDiff(next.range,prev.range)+')');
 if(!changes.length)changes.push(types[t.type].desc[branch]);
 return changes.join(' · ');
}
