  <script>
/* Overload Defense: original self-contained canvas gameplay prototype v0.3.
   No advertising, external assets, network requests or copyrighted third-party sprites.
   Game and illustration both drawn locally with Canvas 2D.
*/
(()=>{
'use strict';
const W=1280,H=720,TOP=58,GROUND_BOTTOM=553,WAVES=10,MAX_TOWER_LEVEL=6;
const canvas=document.getElementById('game');let ctx=canvas.getContext('2d',{alpha:false});
if(!ctx){document.body.innerHTML='Ваш браузер не поддерживает Canvas 2D';return;}
let ratio=1,last=performance.now(),clock=0,particles=[],bolts=[],enemies=[],pads=[],spawn=[],timeToSpawn=0,wave=0,life=20,money=400,selected=-1,buildType=0,mode='choice',speed=1,paused=false,chosen=null,won=false,totalKills=0,toast='',toastTime=0,inspected=0,drag=null,hoverPad=-1,firstUpgradeHint=true; 
const types=[
 {name:'Пулемёт',short:'ПУЛЕМЁТ',cost:100,dmg:13,rate:3.3,range:135,col:'#39e3d4',over:'Шквальный огонь',spec:['Шквал','Бронебой'],desc:['×2 скорострельность','Бронебойные снаряды']},
 {name:'Артиллерия',short:'АРТИЛЛЕРИЯ',cost:190,dmg:47,rate:.72,range:155,col:'#ff9c53',over:'Массированный залп',spec:['Фугас','Бронелом'],desc:['Большой радиус взрыва','Урон тяжёлым целям']},
 {name:'Электрическая',short:'ЭЛЕКТРИЧ.',cost:160,dmg:22,rate:1.35,range:150,col:'#79c8ff',over:'Грозовой разряд',spec:['Цепь','Импульс'],desc:['Больше целей','Оглушение']},
 {name:'Криобашня',short:'КРИО',cost:125,dmg:8,rate:1.05,range:143,col:'#9be5b5',over:'Ледяная буря',spec:['Мороз','Хрупкость'],desc:['Сильная заморозка','Уязвимость к урону']}
];
const padLocations=[[95,310],[228,124],[302,382],[384,143],[501,315],[615,310],[706,358],[807,191],[863,415],[1016,145],[1045,380],[1160,175]];
const keypoints=[[-75,175],[85,180],[192,234],[334,266],[456,219],[560,175],[665,207],[744,272],[830,322],[954,283],[1044,235],[1120,298],[1210,344],[1360,344]];
function catmull(p0,p1,p2,p3,t){const t2=t*t,t3=t2*t;return [.5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),.5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)];}
const road=[];let length=0;
for(let i=0;i<keypoints.length-1;i++){for(let s=0;s<22;s++){const p=catmull(keypoints[Math.max(0,i-1)],keypoints[i],keypoints[i+1],keypoints[Math.min(keypoints.length-1,i+2)],s/22);if(road.length){const prev=road[road.length-1];length+=Math.hypot(p[0]-prev.x,p[1]-prev.y);}road.push({x:p[0],y:p[1],d:length});}}
const fin=keypoints.at(-1);length+=Math.hypot(fin[0]-road.at(-1).x,fin[1]-road.at(-1).y);road.push({x:fin[0],y:fin[1],d:length});
function along(d){if(d<=0)return road[0];if(d>=length)return road.at(-1);let lo=0,hi=road.length-1;while(lo+1<hi){const mid=(lo+hi)>>1;if(road[mid].d<d)lo=mid;else hi=mid;}const a=road[lo],b=road[hi],t=(d-a.d)/(b.d-a.d||1);return {x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t};}
function resize(){const sx=innerWidth/W,sy=innerHeight/H;ratio=Math.min(sx,sy);canvas.style.width=(W*ratio)+'px';canvas.style.height=(H*ratio)+'px';const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);} addEventListener('resize',resize);resize();
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let seed=56125;function rng(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}
const plants=[];const terrainCache=document.createElement('canvas');terrainCache.width=W;terrainCache.height=H;let backgroundRendered=false;
for(let i=0;i<170;i++){const x=rng()*W,y=64+rng()*478;let near=false;for(let k=0;k<road.length;k+=3){if(Math.hypot(road[k].x-x,road[k].y-y)<45){near=true;break;}}if(!near)plants.push({x,y,s:5+rng()*14,v:Math.floor(rng()*5),shade:rng()});}
function reset(){clock=0;particles=[];bolts=[];enemies=[];spawn=[];timeToSpawn=0;wave=0;life=20;money=400;selected=-1;buildType=0;mode='choice';paused=false;speed=1;chosen=null;won=false;totalKills=0;toast='Обучение: перетащи башню из магазина на площадку';toastTime=4;pads=padLocations.map(([x,y],i)=>({x,y,tower:null,id:i}));}
function say(s){toast=s;toastTime=2.5;}
function build(i){const pad=pads[i];if(pad.tower){selected=i;return;}const type=types[buildType];if(money<type.cost){say('Недостаточно монет');return;}money-=type.cost;pad.tower={type:buildType,level:1,spec:-1,angle:0,last:0,overEnd:0,heatEnd:0,readyAt:0,target:null};selected=i;say('Башня построена!');}
// Each purchase is significantly more expensive. Branch choice is free only after buying tier 3.
const UPGRADE_MULTIPLIER=[0,1.5,2.7,4.0,5.9,8.5];
function upgradeCost(t){
 if(t.level>=MAX_TOWER_LEVEL)return null;
 return Math.ceil(types[t.type].cost*UPGRADE_MULTIPLIER[t.level]/5)*5;
}
function towerInvestment(t){
 let total=types[t.type].cost;
 for(let lv=1;lv<t.level;lv++)total+=Math.ceil(types[t.type].cost*UPGRADE_MULTIPLIER[lv]/5)*5;
 return total;
}

function upgrade(){
 if(selected<0||!pads[selected].tower)return;
 const t=pads[selected].tower;
 if(t.level>=MAX_TOWER_LEVEL){say('Максимальный уровень башни: '+MAX_TOWER_LEVEL);return;}
 if(t.level>=3 && t.spec<0){say('Сначала выбери специализацию');return;}
 const cost=upgradeCost(t);
 if(money<cost){say('Не хватает монет на улучшение');return;}
 money-=cost;t.level++;
 if(t.level===3){say('Уровень 3 куплен! Выбери специализацию бесплатно');firstUpgradeHint=false;}
 else say('Башня улучшена до уровня '+t.level);
}
function specialize(branch){
 if(selected<0||!pads[selected].tower)return;
 const t=pads[selected].tower;
 if(t.level!==3||t.spec!==-1)return;
 t.spec=branch;say('Специализация: '+types[t.type].spec[branch]);
}
function overload(i){const pad=pads[i],t=pad.tower;if(!t||mode!=='battle'||clock<t.readyAt||clock<t.heatEnd||clock<t.overEnd)return;t.overEnd=clock+5;t.heatEnd=t.overEnd+3;t.readyAt=t.heatEnd+16;burst(pad.x,pad.y,types[t.type].col,25);say('ПЕРЕГРУЗКА: '+types[t.type].over);}
function sell(){if(selected<0)return;const pad=pads[selected];if(!pad.tower)return;const t=pad.tower;const value=Math.round(towerInvestment(t)*.6);money+=value;pad.tower=null;selected=-1;say('Продано за '+value+' монет');}
function isBoost(t){return clock<t.overEnd;}
function isHot(t){return clock>=t.overEnd&&clock<t.heatEnd;}
function stats(t){
 const d=types[t.type];
 const damageByLevel=[0,1,1.32,1.69,2.04,2.46,2.95];
 const rateByLevel=[0,1,1.14,1.22,1.30,1.36,1.43];
 let dmg=d.dmg*damageByLevel[t.level],rate=d.rate*rateByLevel[t.level],range=d.range+(t.level-1)*8;
 if(t.spec===0){if(t.type===0)rate*=1.85;if(t.type===1)range+=15;if(t.type===2)rate*=1.25;if(t.type===3)range+=30;}
 if(t.spec===1){if(t.type===0||t.type===1)dmg*=1.72;if(t.type===2)dmg*=1.1;if(t.type===3)dmg*=.8;}
 if(isBoost(t)){dmg*=1.65;rate*=1.8;range+=12;}
 return {dmg,rate,range};}
function waveOptions(n){
 if(n===1) return [{hard:false,label:'ОБУЧЕНИЕ',hint:'5 медленных разведчиков • без ловушек',coins:100,count:5,accent:'#6fffaa',guided:true}];
 const count=n<=3?5+Math.ceil(n*1.5):6+Math.ceil(n*2.1);
 return [
  {hard:false,label:'СТАНДАРТ',hint:n<=3?'Неспешное наступление':n<7?'Смешанная колонна':'Усиленная броня',coins:68+n*20,count,accent:'#5eeda6'},
  {hard:true,label:'РИСК',hint:n<=3?'Больше разведчиков':n<7?'Броня и скорость':'Тяжёлый прорыв',coins:105+n*32,count:count+Math.ceil(n*.85),accent:'#ffb46e'}
 ];
}
function chooseWave(hard){
 if(mode!=='choice'||paused)return;
 if(wave===0&&hard)return; // The first wave is intentionally a guided lesson.
 if(wave===0&&pads.every(p=>!p.tower)){say('Сначала построй хотя бы одну башню');return;}
 wave++;
 const opt=waveOptions(wave)[hard?1:0];chosen=opt;spawn=[];
 for(let i=0;i<opt.count;i++){
  let kind='grunt';
  // New mechanics appear gradually: runners from wave 4, armored from wave 5.
  if(wave>=4 && i%4===3)kind='runner';
  if(wave>=5 && i%6===5)kind='tank';
  if(hard&&wave>=3){if(i%4===2)kind='runner';if(wave>=4 && i%4===3)kind='tank';}
  if(wave===10 && i%3===0)kind='tank';
  spawn.push({kind,wave,hard});
 }
 mode='battle';timeToSpawn=.8;selected=-1;
 say((opt.guided?'ПЕРВАЯ ВОЛНА · ОБУЧЕНИЕ':opt.label+' · ВОЛНА '+wave));
}
function enemy(kind,n,hard){
 // Rising health and mixed enemy composition make higher waves genuinely tougher.
 // First three waves remain forgiving so the player can learn core controls.
 const extra=Math.max(0,n-3);
 const hp=kind==='tank'?170+n*33+8*Math.max(0,n-5)**2:
          kind==='runner'?35+n*9+2*Math.max(0,n-4)**2:
          62+n*13+2.5*extra*extra;
 const base=kind==='tank'?33:kind==='runner'?65:37;
 const speedRamp=1+Math.max(0,n-3)*.027;
 const v=base*speedRamp*(hard?1.05:1);
 const finalHP=hp*(hard?1.25:1)*(1+Math.max(0,n-5)*.055);
 return {kind,d:-15,hp:finalHP,max:finalHP,v,
  bounty:kind==='tank'?22:kind==='runner'?10:8,slowUntil:0,slowMult:1,stunUntil:0,fragileUntil:0,dead:false,id:Math.random()};
}
function hurt(e,amount,type){if(e.dead)return;if(e.fragileUntil>clock)amount*=1.3;if(type===0&&e.kind==='tank')amount*=.58; // armor resists bullets
 if(type===1&&e.kind==='tank')amount*=1.16;
 e.hp-=amount;if(e.hp<=0){e.dead=true;totalKills++;money+=e.bounty;const p=along(e.d);burst(p.x,p.y,e.kind==='tank'?'#ffc16a':'#8dffff',10);}}
function burst(x,y,color,n){for(let i=0;i<n;i++){let a=rand(0,Math.PI*2),sp=rand(18,110);particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-24,life:rand(.3,.7),age:0,col:color,r:rand(1.5,4.5)});}if(particles.length>400)particles.splice(0,particles.length-400);}
function fire(pad,t,target){const s=stats(t),from={x:pad.x,y:pad.y-19};let p=along(target.d);t.angle=Math.atan2(p.y-pad.y,p.x-pad.x);const boosted=isBoost(t);
 if(t.type===2){const arc=[target],range= t.spec===0?5:boosted?4:3;
 for(let i=1;i<range;i++){let prev=arc.at(-1),point=along(prev.d),other=enemies.filter(e=>!e.dead&&!arc.includes(e)&&Math.hypot(along(e.d).x-point.x,along(e.d).y-point.y)<95).sort((a,b)=>Math.hypot(along(a.d).x-point.x,along(a.d).y-point.y)-Math.hypot(along(b.d).x-point.x,along(b.d).y-point.y))[0];if(!other)break;arc.push(other);}
 let prev=from;for(let i=0;i<arc.length;i++){const e=arc[i],q=along(e.d);bolts.push({kind:'arc',x:prev.x,y:prev.y,tx:q.x,ty:q.y,life:.17,age:0,col:'#a4f4ff'});hurt(e,s.dmg*Math.pow(.72,i),t.type);if(t.spec===1)e.stunUntil=Math.max(e.stunUntil,clock+.35);prev=q;}return;}
 if(t.type===3){hurt(target,s.dmg,t.type);target.slowUntil=clock+2.2;target.slowMult=t.spec===0?.28:.48;if(t.spec===1)target.fragileUntil=clock+2.2;bolts.push({kind:'arc',x:from.x,y:from.y,tx:p.x,ty:p.y,life:.2,age:0,col:'#86f8dd'});return;}
 bolts.push({kind:t.type===1?'shell':'bullet',x:from.x,y:from.y,tx:p.x,ty:p.y,enemy:target,tower:t,life:t.type===1?.35:.16,age:0,col:t.type===1?'#ff9f55':'#fcf4b9',damage:s.dmg});}
function impact(b){const e=b.enemy,position=e&&!e.dead?along(e.d):{x:b.tx,y:b.ty};if(b.kind==='bullet'){if(e&&!e.dead)hurt(e,b.damage,0);burst(position.x,position.y,'#ffe9a1',2);}else{const radius=b.tower.spec===0?75:50;burst(position.x,position.y,'#ffab4d',19);for(const en of enemies){const q=along(en.d),dist=Math.hypot(q.x-position.x,q.y-position.y);if(!en.dead&&dist<radius)hurt(en,b.damage*(1-.25*dist/radius),1);}}}
function update(dt){if(paused)return;clock+=dt;toastTime=Math.max(0,toastTime-dt);
 for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.age+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=170*dt;if(p.age>=p.life)particles.splice(i,1);}
 for(let i=bolts.length-1;i>=0;i--){const b=bolts[i];b.age+=dt;if(b.age>=b.life){if(b.kind==='bullet'||b.kind==='shell')impact(b);bolts.splice(i,1);}}
 if(mode!=='battle')return;
 timeToSpawn-=dt;if(spawn.length&&timeToSpawn<=0){const next=spawn.shift();enemies.push(enemy(next.kind,next.wave,next.hard));timeToSpawn=wave===1?1.45:(chosen.hard?.83:1.11)/Math.min(1.28,1+Math.max(0,wave-4)*.03);}
 for(const e of enemies){if(e.dead)continue;const slow=e.slowUntil>clock?e.slowMult:1;const stun=e.stunUntil>clock?0:1;e.d+=e.v*dt*slow*stun;if(e.d>=length){e.dead=true;life=Math.max(0,life-(e.kind==='tank'?3:1));burst(1208,340,'#ff6767',13);if(life===0){mode='lost';say('Оборона прорвана!');}}}
 for(const pad of pads){const t=pad.tower;if(!t||isHot(t))continue;const s=stats(t);const visible=enemies.filter(e=>!e.dead&&(()=>{const q=along(e.d);return Math.hypot(q.x-pad.x,q.y-pad.y)<s.range;})()).sort((a,b)=>b.d-a.d);if(visible.length){t.target=visible[0];const p=along(visible[0].d);t.angle=Math.atan2(p.y-pad.y,p.x-pad.x);}t.last-=dt;if(visible.length&&t.last<=0){fire(pad,t,visible[0]);t.last=1/s.rate;}}
 enemies=enemies.filter(e=>!e.dead);
 if(mode==='battle'&&!spawn.length&&!enemies.length){money+=chosen.coins;selected=-1;mode=wave>=WAVES?'won':'choice';if(mode==='won'){won=true;saveBest();say('ПОБЕДА! Ядро защищено');}else say('Волна пройдена! +'+chosen.coins+' монет');}
}
function saveBest(){try{localStorage.setItem('overload-defense-best',String(Math.max(wave,Number(localStorage.getItem('overload-defense-best'))||0)));}catch{}}
// Canvas primitives (all illustration is original and programmatically generated).
function rr(x,y,w,h,r=12,fill='#14273f',stroke=null,lw=1){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}}
function circle(x,y,r,fill,stroke=null,lw=1){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}}
function polygon(pts,fill,stroke=null,lw=2){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}}
function line(a,b,col,width=2){ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.strokeStyle=col;ctx.lineWidth=width;ctx.stroke();}
function label(s,x,y,size=16,col='#e9f7ff',align='left',bold=700){ctx.font=`${bold} ${size}px system-ui,-apple-system,Segoe UI,sans-serif`;ctx.fillStyle=col;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y);}
function gradient(x,y,w,h,c1,c2){const g=ctx.createLinearGradient(x,y,x,y+h);g.addColorStop(0,c1);g.addColorStop(1,c2);return g;}
function tree(x,y,sz,t){
 ctx.save();ctx.translate(x,y);let scl=sz/15;ctx.scale(scl,scl);
 // A stout comic-book alien tree with a wiggly teal trunk and lilac crown.
 polygon([[-5,14],[-3,-4],[-9,-13],[0,-8],[8,-19],[5,9],[12,15]],'#24675c','#173c52',2.8);
 circle(-13,-8,13,'#713aab','#2e4160',3);circle(5,-16,16,t<.5?'#b04ed5':'#9255be','#44336e',3);
 circle(-5,-23,14,'#dd7fea','#6941a5',2.5);circle(17,-9,11,'#ce75e2','#59408b',2.5);
 circle(-11,-28,5,'#f3b9ff');circle(11,-21,4,'#f4b9f4');
 circle(6,-4,3,'#f3d3ff');ctx.restore();
}
function crystal(x,y,sz,col){
 const k=sz*.8;
 ctx.save();ctx.shadowColor='#63f7ff';ctx.shadowBlur=8;
 polygon([[x-k*.55,y+7],[x-k*.75,y-k*.35],[x,y-k],[x+k*.45,y-k*.21],[x+k*.65,y+7]],col,'#285c89',2.4);
 polygon([[x,y-k],[x+k*.45,y-k*.21],[x+k*.65,y+7],[x+.5,y+4]],'#56dfed','#b0ffff',1.2);
 polygon([[x-k*.55,y+7],[x-k*.75,y-k*.35],[x,y-k],[x+.5,y+4]],'#63bbef',null,0);
 line([x-2,y-k*.65],[x-2,y+2],'#e0ffff',1.6);ctx.restore();
}
function flower(x,y,s){
 ctx.save();ctx.translate(x,y);
 const n=5,rrr=s*.63;
 for(let k=0;k<n;k++){const a=k*2*Math.PI/n;
  const px=Math.cos(a)*rrr,py=Math.sin(a)*rrr;
  circle(px,py,s*.45,k%2?'#df8df2':'#b65bd6','#68458f',1.7);
 }
 circle(0,0,s*.35,'#f9cb6b','#9b5c73',1.8);ctx.restore();
}
function ferns(x,y,sz){
 for(let i=0;i<5;i++){
  const a=-Math.PI*.95+i*Math.PI*.22,ex=x+Math.cos(a)*sz,ey=y-4+Math.sin(a)*sz;
  line([x,y+4],[ex,ey],'#266c5e',3.5);
  circle(ex,ey,3.7,i%2?'#b4ef74':'#79d5a0','#277666',1);
 }

function drawEnd(){if(mode!=='lost'&&mode!=='won')return;ctx.fillStyle='#06172bbd';ctx.fillRect(0,TOP,W,GROUND_BOTTOM-TOP);rr(410,172,460,303,22,'#1c3c58','#abddda',3);label(mode==='won'?'ПОБЕДА!':'ОБОРОНА ПРОРВАНА',640,219,31,mode==='won'?'#ffdc80':'#ffae9c','center');label('Волн пройдено: '+(mode==='won'?WAVES:Math.max(0,wave-1)),640,283,22,'#eaffff','center');label('Уничтожено врагов: '+totalKills,640,320,20,'#a9dbe5','center');label('Все 10 волн можно пройти без рекламы',640,354,17,'#d1dfbd','center');button(500,394,280,59,'↻ НАЧАТЬ ЗАНОВО','#2a9676');}
function drawDraggedTower(){
 if(!drag||!drag.moved)return;const p=drag.now;
 if(hoverPad>=0){const pad=pads[hoverPad];circle(pad.x,pad.y,48,'#b8ffaa40','#d5ffc0',4);}
 ctx.save();ctx.globalAlpha=.85;ctx.shadowBlur=16;ctx.shadowColor='#a6efff';towerIcon(p.x,p.y-25,drag.type,1.45);ctx.restore();
}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#12273c';ctx.fillRect(0,0,W,TOP);if(!backgroundRendered){const old=ctx;ctx=terrainCache.getContext('2d');terrain();ctx=old;backgroundRendered=true;}ctx.drawImage(terrainCache,0,0);for(const pad of pads)if(!pad.tower)platform(pad.x,pad.y,true);for(const pad of pads)if(pad.tower)turret(pad);drawDraggedTower();renderBolts();for(const e of enemies)renderEnemy(e);particlesDraw();drawHUD();drawBottom();drawWaveCards();drawEnd();if(paused){ctx.fillStyle='#06172ca8';ctx.fillRect(0,58,1280,495);rr(490,211,300,132,18,'#1d4058','#a0ddee',2);label('ПАУЗА',640,253,38,'#f2ffff','center');label('Нажми ▶ вверху справа',640,304,19,'#c7e6e9','center');}}
function hit(p,x,y,w,h){return p.x>=x&&p.x<=x+w&&p.y>=y&&p.y<=y+h;}
function click(p){
 if(hit(p,1172,7,90,45)){paused=!paused;return;}
 if(hit(p,1072,7,89,45)){if(wave===1&&mode==='battle'){say('Ускорение откроется после обучения');return;}speed=speed===1?2:1;return;}
 if(paused)return;
 if(mode==='won'||mode==='lost'){
  if(hit(p,500,394,280,59))reset();return;
 }
 if(p.y>=572){
  for(let i=0;i<typeRects.length;i++){
   const r=typeRects[i];if(hit(p,r.x,r.y,r.w,r.h)){buildType=i;selected=-1;return;}
  }
  if(selected>=0&&pads[selected].tower){
   const t=pads[selected].tower;
   if(hit(p,953,651,300,45)){overload(selected);return;}
   if((t.level<3 || (t.level>=3&&t.spec>=0)) && t.level<MAX_TOWER_LEVEL){
    if(hit(p,497,643,253,48))upgrade();
    else if(hit(p,759,643,147,48))sell();
    return;
   }
   if(t.spec<0){
    if(hit(p,494,661,198,37))specialize(0);
    else if(hit(p,701,661,206,37))specialize(1);
    return;
   }
   if(hit(p,786,645,120,44))sell();
  }
  return;
 }
 if(mode==='choice'){
  if(wave===0){if(hit(p,469,468,341,49)){chooseWave(false);return;}}
  else{
   if(hit(p,350,395,279,114)){chooseWave(false);return;}
   if(hit(p,646,395,279,114)){chooseWave(true);return;}
  }
 }
 for(let i=pads.length-1;i>=0;i--){const pad=pads[i];if(pad.tower&&Math.hypot(p.x-pad.x,p.y-(pad.y<158?pad.y+49:pad.y-84))<23){overload(i);selected=i;return;}}
 for(let i=pads.length-1;i>=0;i--){const pad=pads[i];if(Math.hypot(p.x-pad.x,p.y-pad.y)<43){build(i);return;}}
 selected=-1;
}
function pointerPoint(e){const rect=canvas.getBoundingClientRect();return{x:(e.clientX-rect.left)/rect.width*W,y:(e.clientY-rect.top)/rect.height*H};}
function padAt(point){
 let pick=-1,dist=49;
 for(let i=0;i<pads.length;i++){
  const p=pads[i];if(p.tower)continue;
  const d=Math.hypot(point.x-p.x,point.y-p.y);
  if(d<dist){dist=d;pick=i;}
 }
 return pick;
}
function shopAt(p){
 for(let i=0;i<typeRects.length;i++){
  const r=typeRects[i];if(hit(p,r.x,r.y,r.w,r.h))return i;
 }
 return -1;
}
function finishDrag(p){
 if(!drag)return;
 const type=drag.type,wasMoving=drag.moved;
 const dest=padAt(p);
 drag=null;hoverPad=-1;
 if(wasMoving){
  if(dest>=0){buildType=type;build(dest);}
  else if(p.y>=572){buildType=type;selected=-1;}
  else say('Отпусти фигуру над свободной площадкой с «+»');
 }else{buildType=type;selected=-1;}
}
canvas.addEventListener('pointerdown',e=>{
 e.preventDefault();const p=pointerPoint(e);
 if(!paused&&mode!=='won'&&mode!=='lost'){
  const type=shopAt(p);
  if(type>=0){
   drag={pointer:e.pointerId,type,start:p,now:p,moved:false};
   try{canvas.setPointerCapture(e.pointerId);}catch{}
   return;
  }
 }
 click(p);
},{passive:false});
canvas.addEventListener('pointermove',e=>{
 if(!drag||drag.pointer!==e.pointerId)return;
 e.preventDefault();const p=pointerPoint(e);
 drag.now=p;
 if(Math.hypot(p.x-drag.start.x,p.y-drag.start.y)>12)drag.moved=true;
 hoverPad=drag.moved?padAt(p):-1;
},{passive:false});
canvas.addEventListener('pointerup',e=>{
 if(!drag||drag.pointer!==e.pointerId)return;
 e.preventDefault();finishDrag(pointerPoint(e));
},{passive:false});
canvas.addEventListener('pointercancel',e=>{
 if(drag&&drag.pointer===e.pointerId){drag=null;hoverPad=-1;}
},{passive:true});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
let running=true;function frame(now){if(!running)return;let dt=Math.min((now-last)/1000,.06);last=now;update(dt*speed);draw();requestAnimationFrame(frame);}
addEventListener('visibilitychange',()=>{if(document.hidden)paused=true;});
// Small development-only API for deterministic smoke tests, harmless in released prototype.
window.OverloadDefenseTest={state:()=>({wave,mode,life,money,selected,enemyCount:enemies.length,towerCount:pads.filter(x=>x.tower).length,kills:totalKills,clock,towers:pads.map(p=>p.tower?{type:p.tower.type,level:p.tower.level,spec:p.tower.spec,costToUpgrade:upgradeCost(p.tower),investment:towerInvestment(p.tower)}:null),spawnCount:spawn.length,enemySpeeds:enemies.map(e=>e.v),drag:drag?{type:drag.type,moved:drag.moved}:null}),chooseWave,reset,step:(dt)=>update(dt),buildTower:(type,pad)=>{buildType=type;build(pad);},selectPad:(pad)=>{selected=pad;},upgrade,specialize,overload,roadLength:()=>length,upgradeCostFor:(type,level)=>upgradeCost({type,level}),MAX_TOWER_LEVEL,statsFor:(type,level,spec)=>stats({type,level,spec,overEnd:0,heatEnd:0,readyAt:0})};
reset();requestAnimationFrame(frame);
})();

</script>
