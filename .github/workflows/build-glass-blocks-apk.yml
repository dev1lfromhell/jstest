name: Build Glass Blocks Android touch-test APK

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile-test/**"
      - "block-forge-touch-test/v15.html"
      - ".github/workflows/build-glass-blocks-apk.yml"

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
          cache-disabled: true

      - name: Use Android SDK preinstalled on runner
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "${GITHUB_ENV}"
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MANAGER="$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$MANAGER"
          "$MANAGER" --sdk_root="$SDK_DIR" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Embed offline game
        run: |
          mkdir -p mobile-test/app/src/main/assets
          cp block-forge-touch-test/v15.html mobile-test/app/src/main/assets/index.html
          test -s mobile-test/app/src/main/assets/index.html

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p mobile-test assembleDebug

      - name: Verify debug APK
        run: |
          test -s mobile-test/app/build/outputs/apk/debug/app-debug.apk
          unzip -t mobile-test/app/build/outputs/apk/debug/app-debug.apk | tail -1

      - name: Upload installable test build
        uses: actions/upload-artifact@v4
        with:
          name: glass-blocks-android-debug-v15
          path: mobile-test/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
