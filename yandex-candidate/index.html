   const size=SHAPES[i].length;

  ctx.strokeStyle=color(hex,.82);ctx.lineWidth=Math.max(1,w*.058);
  ctx.beginPath();ctx.moveTo(x+w-1.7,y+corner);ctx.lineTo(x+w-1.7,y+h-corner);
  ctx.lineTo(x+w-corner,y+h-1.7);ctx.lineTo(x+corner,y+h-1.7);ctx.stroke();
  poly([[px+1,py+1],[px+pw*.78,py+1],[px+pw*.3,py+ph*.47],[px+1,py+ph*.66]],'rgba(255,255,255,.16)');
  if(w>25){
   poly([[px+pw*.64,py+2],[px+pw*.79,py+2],[px+pw*.28,py+ph*.86],[px+pw*.21,py+ph*.86]],'rgba(255,255,255,.19)');
   ctx.strokeStyle='rgba(255,255,255,.24)';ctx.lineWidth=.8;
   ctx.beginPath();ctx.moveTo(px+pw*.15,py+ph*.79);ctx.lineTo(px+pw*.42,py+ph*.54);ctx.stroke();
   rect(px+pw*.74,py+ph*.13,Math.max(2,w*.07),Math.max(2,w*.07),'rgba(255,255,255,.7)',1);
  }
  ctx.restore();
 }
 function draw(){
 ctx.clearRect(0,0,W,H);
 const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0c1427');bg.addColorStop(1,'#111f37');rect(0,0,W,H,bg);
 const halo=ctx.createRadialGradient(240,365,25,240,365,370);halo.addColorStop(0,'rgba(67,115,203,.12)');halo.addColorStop(1,'rgba(7,16,34,0)');rect(0,0,W,H,halo);
 text('BLOCK FORGE',48,34,19,'#b5c7e4','left',800);
  text('YA  v1.5',304,34,11,'#647b9e','right',600);
  rect(349,15,82,34,muted?'rgba(83,97,122,.4)':'rgba(40,136,166,.65)',9);
  text(muted?'🔇 OFF':'🔊 ON',390,32,15,muted?'#889ab8':'#b7ebf3','center',750);
 ctx.save();ctx.translate(48,77);const pulse=1+.11*scorePulse;ctx.scale(pulse,pulse);text('Score '+score,0,0,27,'#f1f6ff','left',750);ctx.restore();text('Best '+best,432,77,24,'#a6bcdd','right',650);
 text(over?'No moves left!':(clearStreak>1?'Combo streak '+clearStreak+' — keep clearing!':'Drag a piece onto the board'),48,124,16,over?'#ffa1a1':'#9aadc9');
 rect(OX-8,OY-8,N*C+16,N*C+16,'rgba(4,10,24,.45)',13);
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){
  const xx=OX+x*C+2,yy=OY+y*C+2,slot=board[y][x];
  if(slot<0){rect(xx,yy,C-4,C-4,'#25324a',4);rect(xx+2,yy+2,C-8,2,'rgba(255,255,255,.035)');}
  else tile(xx,yy,C-4,C-4,COLORS[slot]);
 }
 if(dragging&&selected>=0&&pieces[selected]>=0){
  const shape=SHAPES[pieces[selected]];
  if(snap){for(const [dx,dy] of shape){rect(OX+(snap[0]+dx)*C+1,OY+(snap[1]+dy)*C+1,C-2,C-2,'rgba(82,240,178,.17)',6);}}
  const hex=COLORS[selected];
  for(const [dx,dy] of shape)tile(smoothGhost[0]+dx*C+2,smoothGhost[1]+dy*C+2,C-4,C-4,hex,.84);
 }
 text('CHOOSE A BLOCK',48,589,12,'#7185a8','left',750);
 for(let i=0;i<3;i++){
  const bx=55+i*142,by=605;
  rect(bx,by,115,78,i===selected?'#475569':'#1e293b',10);
  rect(bx+1,by+1,113,76,'rgba(255,255,255,.018)',9);
  if(pieces[i]<0)continue;
  const shape=SHAPES[pieces[i]];
   const mx=Math.max(...shape.map(p=>p[0])),my=Math.max(...shape.map(p=>p[1]));
   const step=Math.min(22,94/(mx+1),58/(my+1)),sz=step-3;
   const startX=bx+(115-((mx+1)*step-3))/2;
   const startY=by+(78-((my+1)*step-3))/2;
   for(const [dx,dy] of shape)tile(startX+dx*step,startY+dy*step,sz,sz,COLORS[i]);
 }
 rect(310,690,122,50,'#334867',12);
 rect(313,693,116,44,'#415b7e',10);text('New game',371,716,16,'#edf5ff','center',700);
 text('Swipe up, then release to place',240,778,15,'#8aa0bf','center',500);
 text('Browser touch preview • Godot build unchanged',240,815,11,'#60789b','center',500);
 for(const shard of particles){
   const t=shard.age/shard.life,fade=Math.max(0,1-t),sz=shard.size*(1-.37*t);
   ctx.save();ctx.translate(shard.x,shard.y);
   if(shard.type==='spark'){
    ctx.globalAlpha=fade*fade;
    ctx.strokeStyle='rgba(241,252,255,.95)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(-sz*2,0);ctx.lineTo(sz*2,0);
    ctx.moveTo(0,-sz*2);ctx.lineTo(0,sz*2);ctx.stroke();
   }else{
    ctx.rotate(shard.rotation);ctx.globalAlpha=fade*fade;
    const shape=shard.type==='sliver'
      ?[[-sz*.18,-sz],[sz*.45,-sz*.15],[sz*.12,sz*.9]]
      :[[-sz*.82,-sz*.48],[sz*.78,-sz*.24],[sz*.05,sz]];
    const g=ctx.createLinearGradient(-sz,-sz,sz,sz);
    g.addColorStop(0,'rgba(255,255,255,.88)');
    g.addColorStop(.37,color(shard.hex,.83));
    g.addColorStop(1,color(shard.hex,.29));
    poly(shape,g);
    ctx.strokeStyle='rgba(236,250,255,.9)';ctx.lineWidth=.95;
    ctx.beginPath();ctx.moveTo(...shape[0]);ctx.lineTo(...shape[1]);ctx.stroke();
    ctx.strokeStyle='rgba(4,19,40,.48)';ctx.lineWidth=.6;
    ctx.beginPath();ctx.moveTo(...shape[1]);ctx.lineTo(...shape[2]);ctx.stroke();
   }
   ctx.restore();
  }
  for(const wave of waves){const t=wave.age/wave.life,r=8+23*t;ctx.beginPath();ctx.arc(wave.x,wave.y,r,0,2*Math.PI);ctx.strokeStyle=color(wave.hex,(1-t)*.75);ctx.lineWidth=3;ctx.stroke();ctx.beginPath();ctx.arc(wave.x,wave.y,r*.45,0,2*Math.PI);ctx.fillStyle=color(wave.hex,(1-t)*.25);ctx.fill();}
 for(const p of scorePopups){
   const t=p.age/p.life;
   ctx.save();ctx.globalAlpha=Math.min(1,(1-t)*2);ctx.shadowColor='#bff9fc';ctx.shadowBlur=12;
   text(p.label,p.x,p.y-t*65,30,'#e6feff','center',800);ctx.restore();
  }
  if(flash>0)rect(OX,OY,N*C,N*C,`rgba(255,210,98,${flash*.22})`);
 if(over){
 rect(OX,OY,N*C,N*C,'rgba(7,13,27,.7)');
 rect(87,280,306,246,'#1f3454',16);
 text('NO MOVES',240,322,28,'#f5f8ff','center',800);
 text('Score  '+score,240,361,22,'#b7cbed','center');
 if(window.ysdk&&!revived){
  rect(110,393,260,54,'#287e80',12);
  text(adBusy?'Opening ad…':'WATCH AD · CONTINUE',240,420,16,'#fff','center',700);
 }else{text(revived?'Second chance used':'Play again',240,421,16,'#b7cbed','center');}
 rect(110,458,260,54,'#415b7e',12);
 text('NEW GAME',240,485,18,'#f1f6ff','center',700);
}
}
function frame(t){
 const dt=Math.min((t-lastTime)/1000,.05);lastTime=t;
 if(dragging&&selected>=0&&pieces[selected]>=0){const target=targetForDrag();if(target){if(!ghostReady){smoothGhost=target.slice();ghostReady=true;}else{const k=1-Math.exp(-22*dt);smoothGhost[0]+=(target[0]-smoothGhost[0])*k;smoothGhost[1]+=(target[1]-smoothGhost[1])*k;}}}
 for(let i=particles.length-1;i>=0;i--){const s=particles[i];s.age+=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=480*dt;if(s.spin)s.rotation+=s.spin*dt;s.vx*=Math.exp(-.75*dt);if(s.age>=s.life)particles.splice(i,1);}
 for(let i=waves.length-1;i>=0;i--){waves[i].age+=dt;if(waves[i].age>=waves[i].life)waves.splice(i,1);}
 for(let i=scorePopups.length-1;i>=0;i--){scorePopups[i].age+=dt;if(scorePopups[i].age>=scorePopups[i].life)scorePopups.splice(i,1);}
  flash=Math.max(0,flash-2.8*dt);scorePulse=Math.max(0,scorePulse-3.5*dt);
 draw();requestAnimationFrame(frame);
}
try{best=Number(localStorage.getItem(storageKey)||0)||0;}catch{best=0;}
newGame();resize();requestAnimationFrame(frame);
 window.gameMounted=true;window.reportReady();
})();
